# WeDLM SFT config. Copy and edit for your run.
# DO NOT put credentials here. WANDB_API_KEY is read from the environment
# (see .env.example) by train.sh and exported before launching.

# Model
model_path: "tencent/WeDLM-8B-Base"   # HF repo or local path
trust_remote_code: true

# Data — JSONL where each line is a JSON array of chat messages:
#   [{"role": "user", "content": "..."}, {"role": "assistant", "content": "..."}]
train_data: "./data/train.jsonl"
max_seq_length: 2048

# WeDLM diffusion settings
block_size: 32
mask_per_block: true
loss_weighting_scheme: "weighted"
mask_eps: 1.0e-8
num_learnable_im_end: 0

# Auxiliary AR loss
enable_ar_loss: true
ar_loss_weight: 1.0

# Attention backend: "magi" (requires MagiAttention installed) or "dense"
attention_backend: "dense"

# Training
output_dir: "./outputs/wedlm-sft"
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 3.0e-6
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0

# Cache
rebuild_cache: false      # set true if you change training data

# DeepSpeed
use_deepspeed: true
deepspeed_zero_stage: 2
deepspeed_offload_optimizer: true
deepspeed_offload_param: false

# Logging
logging_steps: 10
save_steps: 500
save_total_limit: 3

# Precision
bf16: true
seed: 42

# WandB (optional — leave use_wandb: false to disable)
use_wandb: false
wandb_project: "wedlm-sft"
# wandb_team: null
# wandb_group: null
# Credentials are taken from the environment (WANDB_API_KEY); see .env.example.
